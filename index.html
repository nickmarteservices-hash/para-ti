<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Para Ti 🌻</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: linear-gradient(180deg, #0a0a2e 0%, #1a1a4e 40%, #2d1b4e 70%, #1a0a2e 100%);
      min-height: 100vh;
      overflow-x: hidden;
      color: #fff;
      position: relative;
    }
    .stars {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--d) ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .moon {
      position: fixed;
      top: 8%; right: 10%;
      width: 70px; height: 70px;
      background: radial-gradient(circle at 35% 35%, #fff9c4, #ffd54f 40%, #ffb300);
      border-radius: 50%;
      box-shadow: 0 0 40px 15px rgba(255, 213, 79, 0.4), 0 0 80px 30px rgba(255, 179, 0, 0.2);
      z-index: 1;
      animation: moonGlow 4s ease-in-out infinite;
    }
    @keyframes moonGlow {
      0%, 100% { box-shadow: 0 0 40px 15px rgba(255, 213, 79, 0.4), 0 0 80px 30px rgba(255, 179, 0, 0.2); }
      50% { box-shadow: 0 0 50px 20px rgba(255, 213, 79, 0.6), 0 0 100px 40px rgba(255, 179, 0, 0.3); }
    }
    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .header {
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeInUp 1.5s ease forwards 0.3s;
    }
    .para-ti {
      font-size: 0.9rem;
      letter-spacing: 0.4em;
      color: #ffd54f;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .title {
      font-size: 2.4rem;
      font-weight: normal;
      color: #fff8e7;
      text-shadow: 0 0 20px rgba(255, 213, 79, 0.5);
    }
    .title span { display: inline-block; animation: bounce 2s ease infinite; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 213, 79, 0.25);
      border-radius: 24px;
      padding: 28px 24px;
      max-width: 360px;
      width: 100%;
      margin: 20px 0;
      opacity: 0;
      animation: fadeInUp 1.5s ease forwards 0.8s;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .message {
      font-size: 1.15rem;
      line-height: 1.7;
      color: #fff8e7;
      margin-bottom: 20px;
    }
    .message p { margin-bottom: 12px; }
    .highlight {
      color: #ffd54f;
      font-weight: bold;
    }
    .flowers {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 16px 0;
      flex-wrap: wrap;
    }
    .flower {
      font-size: 2.2rem;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 0 8px rgba(255, 213, 79, 0.5));
      user-select: none;
    }
    .flower:active, .flower.bloomed {
      transform: scale(1.4) rotate(15deg);
    }
    .secret {
      display: none;
      margin-top: 12px;
      padding: 12px;
      background: rgba(255, 213, 79, 0.15);
      border-radius: 12px;
      font-size: 0.95rem;
      color: #ffe082;
      animation: fadeInUp 0.5s ease;
    }
    .secret.show { display: block; }
    .btn {
      display: inline-block;
      margin-top: 16px;
      padding: 14px 28px;
      background: linear-gradient(135deg, #ffd54f, #ffb300);
      color: #1a0a2e;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(255, 179, 0, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:active {
      transform: scale(0.96);
      box-shadow: 0 2px 10px rgba(255, 179, 0, 0.3);
    }
    .footer {
      margin-top: 24px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.5);
      opacity: 0;
      animation: fadeInUp 1.5s ease forwards 1.5s;
    }
    .sunflowers-bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 12px;
      padding-bottom: 10px;
      z-index: 1;
      pointer-events: none;
      opacity: 0.9;
    }
    .sunflower-plant {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: sway 3s ease-in-out infinite;
    }
    .sunflower-plant:nth-child(2) { animation-delay: 0.5s; }
    .sunflower-plant:nth-child(3) { animation-delay: 1s; }
    .sunflower-plant:nth-child(4) { animation-delay: 1.5s; }
    .sunflower-plant:nth-child(5) { animation-delay: 0.3s; }
    @keyframes sway {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
    .stem {
      width: 4px;
      height: 40px;
      background: linear-gradient(to bottom, #4caf50, #2e7d32);
      border-radius: 2px;
    }
    .petal {
      font-size: 1.8rem;
      filter: drop-shadow(0 0 6px rgba(255, 193, 7, 0.6));
    }
    .hearts {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }
    .heart {
      position: absolute;
      font-size: 1.2rem;
      animation: floatUp 3s ease-out forwards;
      opacity: 0.8;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 0.9; }
      100% { transform: translateY(-100vh) scale(0.5); opacity: 0; }
    }
    .tap-hint {
      font-size: 0.85rem;
      color: rgba(255, 213, 79, 0.7);
      margin-top: 8px;
      animation: pulse 2s ease infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="moon"></div>
  <div class="hearts" id="hearts"></div>
  
  <div class="content">
    <div class="header">
      <div class="para-ti">PARA TI</div>
      <h1 class="title">Escáneame <span>🌻</span></h1>
    </div>
    
    <div class="card">
      <div class="message">
        <p>Hola, bonita ✨</p>
        <p>Este pequeño universo fue creado <span class="highlight">solo para ti</span>.</p>
        <p>Toca los girasoles y descubre lo que hay dentro...</p>
      </div>
      
      <div class="flowers" id="flowers">
        <span class="flower" data-msg="Eres mi razón para sonreír cada día 💛">🌻</span>
        <span class="flower" data-msg="Contigo el mundo se vuelve más brillante ✨">🌻</span>
        <span class="flower" data-msg="Gracias por existir exactamente como eres 🌙">🌻</span>
        <span class="flower" data-msg="Quiero compartir mil aventuras a tu lado 🚀">🌻</span>
        <span class="flower" data-msg="Eres mi persona favorita en todo el universo 🌌">🌻</span>
      </div>
      
      <p class="tap-hint">Toca cada girasol 👆</p>
      <div class="secret" id="secret"></div>
      
      <a href="https://grok.com" class="btn" id="grokBtn" target="_blank" rel="noopener">
        Hablar con Grok 💫
      </a>
    </div>
    
    <div class="footer">
      Hecho con cariño · Powered by Grok
    </div>
  </div>
  
  <div class="sunflowers-bottom">
    <div class="sunflower-plant"><span class="petal">🌻</span><div class="stem"></div></div>
    <div class="sunflower-plant"><span class="petal">🌻</span><div class="stem"></div></div>
    <div class="sunflower-plant"><span class="petal">🌻</span><div class="stem"></div></div>
    <div class="sunflower-plant"><span class="petal">🌻</span><div class="stem"></div></div>
    <div class="sunflower-plant"><span class="petal">🌻</span><div class="stem"></div></div>
  </div>

  <script>
    // Stars
    const starsEl = document.getElementById('stars');
    for (let i = 0; i < 80; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.width = s.style.height = (Math.random() * 2.5 + 0.5) + 'px';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.setProperty('--d', (Math.random() * 3 + 2) + 's');
      s.style.animationDelay = Math.random() * 3 + 's';
      starsEl.appendChild(s);
    }

    // Flowers interaction
    const flowers = document.querySelectorAll('.flower');
    const secret = document.getElementById('secret');
    let revealed = 0;
    
    flowers.forEach(f => {
      f.addEventListener('click', () => {
        if (f.classList.contains('bloomed')) return;
        f.classList.add('bloomed');
        revealed++;
        secret.textContent = f.dataset.msg;
        secret.classList.add('show');
        
        // Hearts
        for (let i = 0; i < 5; i++) {
          setTimeout(() => {
            const h = document.createElement('div');
            h.className = 'heart';
            h.textContent = ['💛','✨','🌻','💫','❤️'][Math.floor(Math.random()*5)];
            h.style.left = (Math.random() * 80 + 10) + '%';
            h.style.bottom = '20%';
            document.getElementById('hearts').appendChild(h);
            setTimeout(() => h.remove(), 3000);
          }, i * 100);
        }
        
        if (revealed === flowers.length) {
          setTimeout(() => {
            secret.innerHTML = '¡Todos los girasoles florecieron! 🌻<br>Ahora ve a hablar con Grok... él tiene más sorpresas para ti 💫';
            document.getElementById('grokBtn').style.animation = 'pulse 1.5s ease infinite';
          }, 800);
        }
      });
    });

    // Prevent zoom on double tap
    document.addEventListener('gesturestart', e => e.preventDefault());
  </script>
</body>
</html>
